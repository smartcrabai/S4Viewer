name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PROJECT: S4 Viewer.xcodeproj
      SCHEME: S4 Viewer
      PROFILE_NAME: S4 Viewer Developer ID
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select Xcode 26
        run: |
          DEVELOPER_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$DEVELOPER_APP"
          xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Import signing certificate and profile
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

          echo "$MACOS_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.provisionprofile"
          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" | plutil -extract UUID raw -o - -)"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.provisionprofile" \
             "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.provisionprofile"
          cp "$RUNNER_TEMP/profile.provisionprofile" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.provisionprofile"

      - name: Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/S4Viewer.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=673KN54RQ5 \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export Developer ID app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/S4Viewer.xcarchive" \
            -exportOptionsPlist Scripts/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          codesign -d -vv --entitlements - "$RUNNER_TEMP/export/S4 Viewer.app"

      - name: Create and sign DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="$RUNNER_TEMP/S4Viewer-$VERSION.dmg"
          hdiutil create -volname "S4 Viewer" \
            -srcfolder "$RUNNER_TEMP/export/S4 Viewer.app" \
            -ov -format UDZO "$DMG"
          codesign -s "Developer ID Application" --timestamp "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          SUBMIT_JSON="$(xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 40m \
            --output-format json)" || SUBMIT_FAILED=1
          echo "$SUBMIT_JSON"
          SUBMISSION_ID="$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" || true
          rm "$RUNNER_TEMP/notary.p8"
          STATUS="$(echo "$SUBMIT_JSON" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          test -z "${SUBMIT_FAILED:-}" && test "$STATUS" = "Accepted"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "S4 Viewer $GITHUB_REF_NAME" \
            --generate-notes
